{% extends "base.html" %}{% set public = true %}
{% block public %}<div class="card" style="max-width:420px;margin:40px auto"><h1>{{ _("Connexion") }}</h1><p class="muted small">{{ _("Espace administration") }}</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="fields" style="grid-template-columns:1fr">
<div><label>{{ _("Email") }}</label><input type="email" name="email" required autofocus></div>
<div><label>{{ _("Mot de passe") }}</label><input type="password" name="password" required></div>
<label class="check"><input type="checkbox" name="remember" checked> {{ _("Rester connecté sur cet appareil") }}</label><button class="btn o">{{ _("Se connecter") }}</button></div></form>
{% if not LOCAL %}<div class="signupcta"><b>{{ _("Nouvelle école ?") }}</b> <a href="{{ url_for('signup') }}">{{ _("Créer mon école — 30 jours gratuits") }}</a></div>{% endif %}</div>{% endblock %}
